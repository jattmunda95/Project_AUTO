<svg xmlns="http://www.w3.org/2000/svg" width="840" height="720" viewBox="0 0 840 720" role="img" aria-labelledby="title desc"><title id="title">Calibrate areas, then ask about locations</title><desc id="desc">Region calibration is a separate camera launch that validates and stores polygons. Normal tracking uses w/r terminal queries and temporary display highlights. SQL stays in the store and geometry stays in memory/regions.py.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M170,115 L170,170" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,240 L170,295" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,365 L170,430" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M642.5,115 L642.5,170" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M642.5,240 L642.5,295" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,500 L170,535 L345,535 L345,560" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M470,330 L415,330 L415,520 L345,520 L345,560" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M642.5,365 L642.5,560" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="20" y="45" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="170" y="75" text-anchor="middle">scripts/define_regions.py</text><text  x="170" y="95" text-anchor="middle">→ region_calibration.py</text><rect x="20" y="170" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="200" text-anchor="middle">camera.py + drawing.py</text><text  x="170" y="220" text-anchor="middle">Show frame; click polygon vertices</text><rect x="20" y="295" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="325" text-anchor="middle">memory/regions.py</text><text  x="170" y="345" text-anchor="middle">Validate polygon; terminal name</text><rect x="20" y="430" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="460" text-anchor="middle">store.py: create_region</text><text  x="170" y="480" text-anchor="middle">Save named polygon</text><rect x="470" y="45" width="345" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="642.5" y="75" text-anchor="middle">main.py → app.py</text><text  x="642.5" y="95" text-anchor="middle">Normal tracking window</text><rect x="470" y="170" width="345" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="642.5" y="200" text-anchor="middle">region_queries.py</text><text  x="642.5" y="220" text-anchor="middle">w: item whereabouts; r: area</text><rect x="470" y="295" width="345" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="642.5" y="325" text-anchor="middle">store.py: read queries</text><text  x="642.5" y="345" text-anchor="middle">Current contents and event history</text><rect x="470" y="560" width="345" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="642.5" y="590" text-anchor="middle">app.py + drawing.py</text><text  x="642.5" y="610" text-anchor="middle">Highlight returned region IDs</text><rect x="245" y="560" width="200" height="100" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="345" y="595" text-anchor="middle">SQLite</text><text  x="345" y="615" text-anchor="middle">Regions, items, events</text><text  x="345" y="635" text-anchor="middle">Shared spatial memory</text><text class="label" x="20" y="24">SEPARATE CALIBRATION LAUNCH</text><text class="label" x="470" y="24">NORMAL TRACKING + QUESTIONS</text></svg>
