<svg xmlns="http://www.w3.org/2000/svg" width="850" height="790" viewBox="0 0 850 790" role="img" aria-labelledby="title desc"><title id="title">One object: observation to permanent memory</title><desc id="desc">A tracker ADD triggers identity resolution. New views create ADDED, matches to removed items create RETURNED, and present matches associate without an event. Movement and absence then update the same permanent item.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M425,95 L425,135" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,205 L425,235 L140,235 L140,270" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,205 L425,270" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,205 L425,235 L710,235 L710,270" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M140,340 L140,385 L425,385 L425,415" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,340 L425,415" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M710,340 L710,385 L425,385 L425,415" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,485 L425,515 L215,515 L215,550" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,485 L425,515 L635,515 L635,550" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M215,620 L215,680" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M635,620 L635,680" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><rect x="275" y="25" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="425" y="55" text-anchor="middle">detector.py → tracker.py</text><text  x="425" y="75" text-anchor="middle">Temporary track → confirmed ADD</text><rect x="275" y="135" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="425" y="165" text-anchor="middle">coordinator.py → worker</text><text  x="425" y="185" text-anchor="middle">scene_processor.py resolves identity</text><rect x="15" y="270" width="250" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="140" y="300" text-anchor="middle">No accepted match</text><text  x="140" y="320" text-anchor="middle">New Item + ADDED</text><rect x="300" y="270" width="250" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="425" y="300" text-anchor="middle">Match to removed item</text><text  x="425" y="320" text-anchor="middle">Same Item + RETURNED</text><rect x="585" y="270" width="250" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="710" y="300" text-anchor="middle">Match to present item</text><text  x="710" y="320" text-anchor="middle">Same Item; association only</text><rect x="275" y="415" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="425" y="445" text-anchor="middle">event_engine.py</text><text  x="425" y="465" text-anchor="middle">Track ID → permanent Item.id</text><rect x="65" y="550" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="215" y="580" text-anchor="middle">tracker.py: MOVE_START</text><text  x="215" y="600" text-anchor="middle">Then MOVE_END + MOVED</text><rect x="485" y="550" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="635" y="580" text-anchor="middle">tracker.py: absent ≥ 2 seconds</text><text  x="635" y="600" text-anchor="middle">REMOVE</text><rect x="65" y="680" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="215" y="710" text-anchor="middle">store.py: MOVED</text><text  x="215" y="730" text-anchor="middle">Save destination and history</text><rect x="485" y="680" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="635" y="710" text-anchor="middle">store.py: REMOVED</text><text  x="635" y="730" text-anchor="middle">Clear current location; keep history</text></svg>
