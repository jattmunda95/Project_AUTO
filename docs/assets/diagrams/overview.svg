<svg xmlns="http://www.w3.org/2000/svg" width="840" height="850" viewBox="0 0 840 850" role="img" aria-labelledby="title desc"><title id="title">Project AUTO: live pipeline</title><desc id="desc">The main thread captures, detects and tracks objects. The coordinator submits identity jobs to a worker and applies results through the event engine and store. Drawing and queries share the main thread. Diagnostic recording is a separate optional launch mode.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M170,110 L170,140" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,210 L170,240" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,310 L170,340" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,410 L170,460" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M320,275 L440,275" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M615,310 L615,340" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,530 L170,600" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="175" y="570" text-anchor="middle">resolved identity / known lifecycle</text><path d="M170,670 L170,730" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M320,765 L440,765" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M320,495 L440,495" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="380" y="480" text-anchor="middle">jobs</text><path d="M615,460 L615,435 L170,435 L170,460" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="410" y="425" text-anchor="middle">results polled on later frames</text><path d="M615,530 L615,590" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M615,690 L615,730" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="615" y="716" text-anchor="middle">reference saves through store.py</text><path d="M790,375 L817,375 L817,765 L790,765" fill="none" stroke="#526875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="20" y="40" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="170" y="70" text-anchor="middle">main.py → app.py</text><text  x="170" y="90" text-anchor="middle">Assemble services; run frame loop</text><rect x="20" y="140" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="170" text-anchor="middle">capture/camera.py</text><text  x="170" y="190" text-anchor="middle">Camera frame</text><rect x="20" y="240" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="270" text-anchor="middle">perception/detector.py</text><text  x="170" y="290" text-anchor="middle">YOLO / OpenVINO + BoT-SORT</text><rect x="20" y="340" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="370" text-anchor="middle">perception/tracker.py</text><text  x="170" y="390" text-anchor="middle">Presence and movement signals</text><rect x="20" y="460" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="170" y="490" text-anchor="middle">events/coordinator.py</text><text  x="170" y="510" text-anchor="middle">Identity and event coordination</text><rect x="20" y="600" 