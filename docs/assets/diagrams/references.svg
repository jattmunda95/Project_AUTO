<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-labelledby="title desc"><title id="title">Reference learning and quality gates</title><desc id="desc">ReferencePolicy nominates sparse baseline, movement or settled-pose candidates. The coordinator performs cheap checks; the worker performs mask quality and applicable novelty checks. Only accepted saves update the prototype and gallery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M170,120 L170,190" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="170" y="155" text-anchor="middle">nominate a candidate</text><path d="M170,260 L170,330" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="170" y="295" text-anchor="middle">only if usable</text><path d="M320,365 L470,365" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M642.5,400 L642.5,470" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M470,505 L320,505" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="395" y="490" text-anchor="middle">accepted</text><path d="M20,505 L8,505 L8,85 L20,85" fill="none" stroke="#526875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="20" y="50" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="170" y="80" text-anchor="middle">reference_policy.py</text><text  x="170" y="100" text-anchor="middle">Baseline / movement / settled pose</text><rect x="20" y="190" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="220" text-anchor="middle">coordinator.py + descriptors.py</text><text  x="170" y="240" text-anchor="middle">Box, confidence, visibility, sharpness</text><rect x="20" y="330" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="360" text-anchor="middle">identification.py</text><text  x="170" y="380" text-anchor="middle">Eligible capture job → queue</text><rect x="470" y="330" width="345" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="642.5" y="360" text-anchor="middle">worker → scene_processor.py</text><text  x="642.5" y="380" text-anchor="middle">SAM2 + DINOv2 or reused reference</text><rect x="470" y="470" width="345" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="642.5" y="500" text-anchor="middle">identification_worker.py</text><text  x="642.5" y="520" text-anchor="middle">Mask quality; applicable novelty</text><rect x="20" y="470" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="500" text-anchor="middle">store.py</text><text  x="170" y="520" text-anchor="middle">Reference + prototype; cap of eight</text><text class="label" x="20" y="25">TIMING + CHEAP CHECKS</text><text class="label" x="470" y="25">EXPENSIVE CHECKS IN WORKER</text><text class="label" x="160" y="605">Accepted result feeds back to policy; worker reloads gallery.</text></svg>
