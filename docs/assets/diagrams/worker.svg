<svg xmlns="http://www.w3.org/2000/svg" width="840" height="810" viewBox="0 0 840 810" role="img" aria-labelledby="title desc"><title id="title">Identity resolution across threads</title><desc id="desc">The coordinator checks eligibility, queues a copied frame, and polls results. The worker prepares a masked view and matches the gallery. The coordinator applies the identity result; the worker saves accepted references and reloads the gallery.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M170,115 L170,170" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M170,240 L170,300" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M320,335 L475,335" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="397" y="320" text-anchor="middle">submit()</text><path d="M640,370 L640,420" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M640,490 L640,540" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M475,575 L320,575" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="397" y="565" text-anchor="middle">queued result</text><path d="M170,610 L170,690" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="170" y="660" text-anchor="middle">poll on a later frame</text><path d="M320,725 L475,725" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="397" y="710" text-anchor="middle">capture job</text><rect x="20" y="45" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="170" y="75" text-anchor="middle">coordinator.py: handle_frame</text><text  x="170" y="95" text-anchor="middle">Poll results; process signals</text><rect x="20" y="170" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="200" text-anchor="middle">identification.py</text><text  x="170" y="220" text-anchor="middle">ReferenceManager: eligible / queued</text><rect x="20" y="300" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="330" text-anchor="middle">IdentificationJob</text><text  x="170" y="350" text-anchor="middle">resolve: frame copy + box + track</text><rect x="475" y="300" width="330" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="640" y="330" text-anchor="middle">identification_worker.py</text><text  x="640" y="350" text-anchor="middle">Bounded queue → process resolve</text><rect x="475" y="420" width="330" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="640" y="450" text-anchor="middle">scene_processor.py</text><text  x="640" y="470" text-anchor="middle">SAM mask, RGB crop, descriptors</text><rect x="475" y="540" width="330" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="640" y="570" text-anchor="middle">memory/reid.py</text><text  x="640" y="590" text-anchor="middle">DINOv2 embedding + gallery match</text><rect x="20" y="540" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="570" text-anchor="middle">IdentificationResult</text><text  x="170" y="590" text-anchor="middle">new / existing / pending / error</text><rect x="20" y="690" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="720" text-anchor="middle">coordinator.py → event_engine.py</text><text  x="170" y="740" text-anchor="middle">Apply result on main thread</text><rect x="475" y="690" width="330" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="640" y="720" text-anchor="middle">Worker → store.py</text><text  x="640" y="740" text-anchor="middle">Save reference; refresh gallery</text><text class="label" x="20" y="25">MAIN THREAD</text><text class="label" x="475" y="25">BACKGROUND WORKER</text></svg>
