<svg xmlns="http://www.w3.org/2000/svg" width="850" height="800" viewBox="0 0 850 800" role="img" aria-labelledby="title desc"><title id="title">Repository roles and separate diagnostic mode</title><desc id="desc">The normal and diagnostic launchers share the live pipeline but use separate databases and diagnostic overrides. Research notebooks are a separate image-folder workflow. Tests validate the application; Markdown and the documentation builder produce this offline portal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M170,120 L170,170 L430,170 L430,210" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M655,120 L655,170 L430,170 L430,210" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="650" y="155" text-anchor="middle">overrides + separate database</text><path d="M170,350 L170,245 L255,245" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M430,280 L430,315 L655,315 L655,350" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="640" y="305" text-anchor="middle">diagnostic mode only</text><path d="M170,520 L170,490 L8,490 L8,245 L255,245" fill="none" stroke="#526875" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="20" y="50" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="80" text-anchor="middle">main.py</text><text  x="170" y="100" text-anchor="middle">Normal project-auto launch</text><rect x="485" y="50" width="340" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="655" y="80" text-anchor="middle">reid_diagnostics_app.py</text><text  x="655" y="100" text-anchor="middle">Separate diagnostic launch</text><rect x="255" y="210" width="350" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="430" y="240" text-anchor="middle">app.py + src/project_auto modules</text><text  x="430" y="260" text-anchor="middle">Shared live processing pipeline</text><rect x="20" y="350" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="380" text-anchor="middle">configs/ + models/</text><text  x="170" y="400" text-anchor="middle">Settings and pretrained detector</text><rect x="485" y="350" width="340" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="655" y="380" text-anchor="middle">utils/reid_diagnostics.py</text><text  x="655" y="400" text-anchor="middle">Queries • scores • outcomes • crops</text><rect x="20" y="520" width="300" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="170" y="550" text-anchor="middle">tests/</text><text  x="170" y="570" text-anchor="middle">Offline checks and simulated UI</text><rect x="485" y="520" width="340" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="655" y="550" text-anchor="middle">notebooks/</text><text  x="655" y="570" text-anchor="middle">Image folders → embeddings / results</text><rect x="255" y="665" width="350" height="70" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="430" y="695" text-anchor="middle">docs/*.md + diagrams.json</text><text  x="430" y="715" text-anchor="middle">build_docs.py → offline HTML / SVG</text><text class="label" x="45" y="480">Validation</text><text class="label" x="510" y="480">Independent experiments</text><text class="label" x="255" y="775">Generated metadata and caches do not add runtime features.</text></svg>
