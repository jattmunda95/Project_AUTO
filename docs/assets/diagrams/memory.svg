<svg xmlns="http://www.w3.org/2000/svg" width="850" height="680" viewBox="0 0 850 680" role="img" aria-labelledby="title desc"><title id="title">Four tables for identity, history and place</title><desc id="desc">An Item has many events and reference embeddings. Regions are optional current locations of items and optional source or destination locations on events. The store owns transactions and calls pure geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526875"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172c3a;font-size:15px}.title{font-weight:600}.label{font-size:13px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style><path d="M425,105 L425,140 L195,140 L195,195" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M425,105 L425,140 L645,140 L645,195" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><path d="M355,245 L480,245" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="418" y="227" text-anchor="middle">current region</text><path d="M195,295 L215,450" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="190" y="372" text-anchor="middle">source / destination</text><path d="M645,295 L645,450" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="645" y="372" text-anchor="middle">one → many</text><path d="M645,295 L645,325 L420,325 L420,410 L215,410 L215,450" fill="none" stroke="#526875" stroke-width="1.5"  marker-end="url(#arrow)"/><text class="label" x="320" y="397" text-anchor="middle">one Item → many events</text><rect x="275" y="35" width="300" height="70" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="425" y="65" text-anchor="middle">memory/store.py</text><text  x="425" y="85" text-anchor="middle">Transactions and query APIs</text><rect x="35" y="195" width="320" height="100" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="195" y="230" text-anchor="middle">REGIONS</text><text  x="195" y="250" text-anchor="middle">Name • polygon • area</text><text  x="195" y="270" text-anchor="middle">memory/regions.py resolves boxes</text><rect x="480" y="195" width="330" height="100" rx="7" fill="#e3f4ed" stroke="#b9cdd4"/><text class="title" x="645" y="230" text-anchor="middle">ITEMS</text><text  x="645" y="250" text-anchor="middle">Permanent ID • status • prototype</text><text  x="645" y="270" text-anchor="middle">Current box and optional region</text><rect x="35" y="450" width="360" height="100" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="215" y="485" text-anchor="middle">ITEM_EVENTS</text><text  x="215" y="505" text-anchor="middle">ADDED / MOVED / REMOVED / RETURNED</text><text  x="215" y="525" text-anchor="middle">Boxes • times • region snapshots</text><rect x="480" y="450" width="330" height="100" rx="7" fill="#edf3f4" stroke="#b9cdd4"/><text class="title" x="645" y="485" text-anchor="middle">ITEM_EMBEDDINGS</text><text  x="645" y="505" text-anchor="middle">Model • embedding • descriptors</text><text  x="645" y="525" text-anchor="middle">Many references for one Item</text><text class="label" x="170" y="610">models.py defines tables; store.py performs persistence.</text></svg>
