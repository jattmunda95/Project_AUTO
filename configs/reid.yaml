model_name: facebook/dinov2-base
device: cpu
# The final match score is now a weighted sum (0.65 DINO + 0.2 color + 0.15
# aspect ratio), not raw DINO cosine similarity alone; color/aspect similarity
# run much higher than DINO's ~0.07 same-item scores observed pre-weighting, so
# 0.55 is a starting estimate, not an empirically tuned value. Retune against
# labelled runs in diagnostics_dir: compare genuine (true-item) scores with
# impostor (other-item) scores and pick a threshold between the two clusters.
acceptance_threshold: 0.55
# The best-scoring item must beat the runner-up by at least this much to be
# accepted, guarding against accepting a weak winner when two items score
# nearly the same. Also an unvalidated starting estimate.
margin_threshold: 0.15
top_k: 3
# 0 disables the prototype shortlist so every gallery item is scored. Used for
# ground-truth collection (6-10 items), so the true item's score is always
# recorded; restore a positive value for large galleries.
prototype_shortlist_size: 0
# Ground-truth diagnostics (utils/reid_diagnostics.py): one folder per run with
# queries.csv, candidates.csv, outcomes.csv and crops/, relative to the project
# root. Resolve jobs only. Comment out to disable.
diagnostics_dir: logs/reid_runs
