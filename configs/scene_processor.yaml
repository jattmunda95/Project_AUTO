background_color: [0, 0, 0]
min_mask_pixels: 100

# Reference-capture scheduling (identity coordinator)
reference_target_count: 6
capture_interval_seconds: 2.0

# How often to retry a still-unresolved (PENDING) identity decision, in seconds.
# Runs SAM2 + DINOv2 inference each attempt; too low will stall the camera loop.
pending_retry_interval_seconds: 1.0
